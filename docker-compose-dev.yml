services:
  rotardv-painel-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: rotardv-painel-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=https://rotardv-api.luisfelipe.dpdns.org
      - NEXTAUTH_URL=http://localhost:3000
